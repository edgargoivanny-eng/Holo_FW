<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Holograma Dalia - Final (Solo Sensor IR)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: black; overflow: hidden; font-family: sans-serif; }
        #interfaz-arduino {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            padding: 15px; background: rgba(20, 20, 20, 0.8); color: white;
            border-radius: 10px; border: 1px solid #00FFFF;
        }
        button {
            background-color: #00FFFF; color: black; font-weight: bold;
            border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px;
        }
        button:hover { background-color: white; }
    </style>
</head>
<body>
    <div id="interfaz-arduino">
        <p style="margin-top:0;"><b>Conexión IR:</b></p>
        <button id="btnConectar">🔌 Conectar Arduino</button>
        <p id="estadoArduino" style="margin-bottom:0; font-size: 12px; color:#aaa;"></p>
    </div>

    <script>
        let petalos = [];
        let gifSuelo; 

        function preload() {
            // URL de tu GIF
            let urlDeTuGif = 'https://upload.wikimedia.org/wikipedia/commons/d/d3/Newtons_cradle_animation_book_2.gif';
            gifSuelo = loadImage(urlDeTuGif);
        }

        // ==========================================
        // SISTEMA WEB SERIAL
        // ==========================================
        let port;
        let reader;

        document.getElementById('btnConectar').addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                
                document.getElementById('interfaz-arduino').style.display = 'none';
                
                leerDatosDelArduino();
            } catch (err) {
                console.error("Error al conectar:", err);
                document.getElementById('estadoArduino').innerText = "🔴 Error. Revisa el cable.";
            }
        });

        async function leerDatosDelArduino() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            let buffer = "";
            while (true) {
                const { value, done } = await reader.read();
                if (done) { reader.releaseLock(); break; }
                
                buffer += value;
                let lineas = buffer.split('\n');
                buffer = lineas.pop(); 
                
                for (let linea of lineas) {
                    if (linea.trim() === "SPAWN") {
                        // LA ÚNICA FORMA DE GENERAR PÉTALOS AHORA ES A TRAVÉS DEL SENSOR
                        petalos.push(new Petalo());
                    }
                }
            }
        }

        // ==========================================
        // MOTOR GRÁFICO P5.JS
        // ==========================================
        function setup() {
            createCanvas(windowWidth, windowHeight);
        }

        function draw() {
            background(0); 

            for (let p of petalos) p.caer();
            
            for (let p of petalos) if (!p.capaFrente) p.mostrar();

            // GIF Panorámico a 100px de altura
            let altoDeseado = 100; 
            if (gifSuelo && gifSuelo.width > 0) {
                let proporcion = gifSuelo.width / gifSuelo.height;
                let anchoCalculado = altoDeseado * proporcion; 
                let posX = (width - anchoCalculado) / 2; 
                image(gifSuelo, posX, height - altoDeseado, anchoCalculado, altoDeseado);
            }

            for (let p of petalos) if (p.capaFrente) p.mostrar();
        }

        // SE ELIMINARON LAS FUNCIONES KEYPRESSED Y MOUSEPRESSED. 
        // LA PANTALLA YA NO REACCIONA A TOQUES O CLICS.

        class Petalo {
            constructor() { this.resetear(); }

            resetear() {
                if (random() > 0.5) {
                    this.x = random(-width * 0.2, width * 0.8);
                    this.y = random(-200, -50); 
                } else {
                    this.x = random(-200, -50);
                    this.y = random(-50, height * 0.6); 
                }
                
                this.capaFrente = random() > 0.5; 
                this.tamBase = random(35, 60); 
                this.proporcion = random(1.3, 1.7); 
                this.velY = random(1.6, 3.6); 
                this.vientoBase = random(3.0, 6.0); 
                this.velVaiven = random(0.015, 0.03); 
                this.amplitudVaiven = random(1.5, 3.5); 
                this.faseInicial = random(TWO_PI); 
                this.anguloRotacion = random(TWO_PI); 
                this.velRotacionPlana = random(-0.02, 0.02); 
                this.velGiro3D = random(0.002, 0.006) * (random() > 0.5 ? 1 : -1); 
                
                this.factorNitidez = random(0.0, 1.0); 
                this.alphaCuerpo = map(this.factorNitidez, 0, 1, 150, 255);
                this.glowExterior = map(this.factorNitidez, 0, 1, 200, 80); 
            }

            caer() {
                this.y += this.velY;
                let balanceo = sin(frameCount * this.velVaiven + this.faseInicial);
                this.x += this.vientoBase + (balanceo * this.amplitudVaiven);
                this.anguloRotacion += this.velRotacionPlana;
                this.inclinacionViento = (this.vientoBase * 0.05) + (balanceo * 0.15);
                
                if (this.y > height + 100 || this.x > width + 150) this.resetear();
            }

            mostrar() {
                let escalaProfundidad = map(this.y, 0, height, 1.0, 0.2, true);
                
                push();
                translate(this.x, this.y);
                rotate(this.anguloRotacion + this.inclinacionViento);
                scale(cos(frameCount * this.velGiro3D + this.faseInicial) * escalaProfundidad, 1 * escalaProfundidad);
                noStroke();

                drawingContext.shadowBlur = this.glowExterior * escalaProfundidad; 
                drawingContext.shadowColor = '#00FFFF'; 
                fill(0, 0, 0, 0); 
                for(let i = 0; i < 3; i++) this.dibujarDalia(this.tamBase, this.tamBase * this.proporcion);

                drawingContext.shadowBlur = 0; 
                fill(0, 255, 255, this.alphaCuerpo); 
                this.dibujarDalia(this.tamBase, this.tamBase * this.proporcion);

                drawingContext.shadowColor = 'white'; 
                drawingContext.shadowBlur = 50 * escalaProfundidad; 
                fill(255, 255, 255, this.alphaCuerpo); 
                this.dibujarDalia(this.tamBase * 0.9, this.tamBase * this.proporcion * 0.9);
                
                drawingContext.shadowBlur = 0; 
                pop();
            }

            dibujarDalia(w, h) {
                beginShape();
                vertex(0, h * 0.5); 
                bezierVertex(w * 0.7, h * 0.1,  w * 0.5, -h * 0.5,  0, -h * 0.5); 
                bezierVertex(-w * 0.5, -h * 0.5, -w * 0.7, h * 0.1,  0, h * 0.5); 
                endShape(CLOSE);
            }
        }

        function windowResized() { resizeCanvas(windowWidth, windowHeight); }
    </script>
</body>
</html>
