<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holograma Dalia - MIT App Inventor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: black; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        let petalos = [];
        let gifSuelo; 

        function preload() {
            // Usamos un enlace directo para evitar problemas de lectura de archivos locales en la app
            gifSuelo = loadImage('https://upload.wikimedia.org/wikipedia/commons/d/d3/Newtons_cradle_animation_book_2.gif');
        }

        function setup() {
            createCanvas(windowWidth, windowHeight);
        }

        // ==============================================================
        // EL PUENTE DE CONEXIÓN CON MIT APP INVENTOR
        // Al usar window.lanzarHolograma, la app externa puede invocarla
        // ==============================================================
        window.lanzarHolograma = function() {
            petalos.push(new Petalo());
        };

        // Dejamos el clic manual en pantalla activo por si necesitas probar sin el cable
        function mousePressed() {
            window.lanzarHolograma();
        }

        function draw() {
            background(0); 

            // 1. Dibujar y mover los pétalos
            // Lo leemos en reversa para poder borrar los pétalos viejos sin errores
            for (let i = petalos.length - 1; i >= 0; i--) {
                petalos[i].caer();
                petalos[i].mostrar();
                
                // Limpiar la memoria del celular cuando el pétalo ya no se ve
                if (petalos[i].y > height + 150) {
                    petalos.splice(i, 1);
                }
            }

            // 2. Dibujar el GIF en la base
            let altoDeseado = 100; 
            if (gifSuelo && gifSuelo.width > 0) {
                let proporcion = gifSuelo.width / gifSuelo.height;
                let anchoCalculado = altoDeseado * proporcion; 
                image(gifSuelo, (width - anchoCalculado) / 2, height - altoDeseado, anchoCalculado, altoDeseado);
            }
        }

        // ==============================================================
        // CLASE: DALIA NEÓN
        // ==============================================================
        class Petalo {
            constructor() { 
                this.x = random(width * 0.2, width * 0.8); // Nace aleatorio a lo ancho
                this.y = -100; // Nace arriba, fuera de la pantalla
                this.tamBase = random(40, 70); 
                this.proporcion = random(1.3, 1.6); 
                this.velY = random(3.0, 5.0); 
                this.velVaiven = random(-1.5, 1.5); 
                this.anguloRotacion = random(TWO_PI); 
                this.velRotacionPlana = random(-0.03, 0.03); 
                this.alphaCuerpo = random(180, 255);
            }

            caer() {
                this.y += this.velY;
                // Efecto de caída de hoja (vaivén)
                this.x += this.velVaiven + sin(frameCount * 0.05) * 2;
                this.anguloRotacion += this.velRotacionPlana;
            }

            mostrar() {
                push();
                translate(this.x, this.y);
                rotate(this.anguloRotacion);
                noStroke();

                // Efecto de Luz (Holograma)
                drawingContext.shadowBlur = 25; 
                drawingContext.shadowColor = '#00FFFF'; 
                fill(0, 255, 255, this.alphaCuerpo); 
                
                // Dibujo del vector de la dalia
                beginShape();
                let w = this.tamBase;
                let h = this.tamBase * this.proporcion;
                vertex(0, h * 0.5); 
                bezierVertex(w * 0.7, h * 0.1,  w * 0.5, -h * 0.5,  0, -h * 0.5); 
                bezierVertex(-w * 0.5, -h * 0.5, -w * 0.7, h * 0.1,  0, h * 0.5); 
                endShape(CLOSE);
                
                pop();
            }
        }

        function windowResized() { 
            resizeCanvas(windowWidth, windowHeight); 
        }
    </script>
</body>
</html>
