<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Holograma Dalia - Degradado Perfecto</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: black; overflow: hidden; font-family: sans-serif; }
        #instrucciones {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            padding: 15px; background: rgba(50, 50, 50, 0.7); color: white;
            border-radius: 10px; pointer-events: none;
            animation: desvanecer 4s forwards; 
        }
        @keyframes desvanecer { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="instrucciones">
        <b>Prueba Visual:</b> Presiona Espacio. Fíjate en el degradado interno y el super resplandor.
    </div>

    <script>
        let petalos = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            petalos.push(new Petalo()); 
        }

        function draw() {
            background(0); 

            for (let p of petalos) {
                p.caer();
                p.mostrar();
            }

            // Suelo oscuro
            fill(5, 15, 15);
            noStroke();
            rect(0, height - 80, width, 80);
        }

        function keyPressed() {
            if (key === ' ' || keyCode === 32) petalos.push(new Petalo());
        }

        function mousePressed() {
            petalos.push(new Petalo());
        }

        class Petalo {
            constructor() { this.resetear(); }

            resetear() {
                this.x = random(-width * 0.1, width * 0.5);
                this.y = random(-200, -50); 
                
                // FORMA DALIA
                this.tamBase = random(35, 60); 
                this.proporcion = random(1.3, 1.7); 
                
                // FÍSICA
                this.velY = random(0.8, 1.8); 
                this.vientoBase = random(1.5, 3.0); 
                this.velVaiven = random(0.01, 0.02); 
                this.amplitudVaiven = random(1, 2.5); 
                this.faseInicial = random(TWO_PI); 
                
                this.anguloRotacion = random(TWO_PI); 
                this.velRotacionPlana = random(-0.015, 0.015); 
                this.velGiro3D = random(0.002, 0.005) * (random() > 0.5 ? 1 : -1); 

                // LUZ CIAN Y ENFOQUE
                this.factorNitidez = random(0.0, 1.0); 
                this.alphaCuerpo = map(this.factorNitidez, 0, 1, 180, 255);
                
                // Resplandor exterior gigantesco (hasta 250px)
                this.glowExterior = map(this.factorNitidez, 0, 1, 250, 100); 
            }

            caer() {
                this.y += this.velY;
                let balanceo = sin(frameCount * this.velVaiven + this.faseInicial);
                this.x += this.vientoBase + (balanceo * this.amplitudVaiven);
                
                this.anguloRotacion += this.velRotacionPlana;
                this.inclinacionViento = (this.vientoBase * 0.1) + (balanceo * 0.2);

                if (this.y > height + 100 || this.x > width + 150) {
                    this.resetear();
                }
            }

            mostrar() {
                push();
                translate(this.x, this.y);
                rotate(this.anguloRotacion + this.inclinacionViento);
                scale(cos(frameCount * this.velGiro3D + this.faseInicial), 1);
                
                noStroke();

                // ==========================================
                // CAPA 0: EL RESPLANDOR EXTERIOR (Estallido x4)
                // ==========================================
                drawingContext.shadowBlur = this.glowExterior;
                drawingContext.shadowColor = '#00FFFF'; // Cian
                fill(0, 0, 0, 0); // Capa invisible, solo aporta luz
                
                // Lo multiplicamos 4 veces usando un ciclo para máxima intensidad
                for(let i = 0; i < 4; i++) {
                    this.dibujarDalia(this.tamBase, this.tamBase * this.proporcion);
                }

                // ==========================================
                // CAPA 1: BASE AZUL CIAN (Sólida, sin blur externo)
                // ==========================================
                drawingContext.shadowBlur = 0; 
                fill(0, 255, 255, this.alphaCuerpo);
                this.dibujarDalia(this.tamBase, this.tamBase * this.proporcion);

                // ==========================================
                // CAPA 2: NÚCLEO BLANCO (Transición / Degradado)
                // ==========================================
                drawingContext.shadowColor = 'white';
                
                // Paso A: Expansión blanca extrema para fundirse con el cian
                drawingContext.shadowBlur = 80; // Altísimo desenfoque
                fill(255, 255, 255, this.alphaCuerpo * 0.9); // Ligeramente transparente
                this.dibujarDalia(this.tamBase * 0.85, this.tamBase * this.proporcion * 0.85);

                // Paso B: El centro brillante
                drawingContext.shadowBlur = 30; // Desenfoque medio
                fill(255, 255, 255, this.alphaCuerpo); // Opaco total
                this.dibujarDalia(this.tamBase * 0.65, this.tamBase * this.proporcion * 0.65);
                
                drawingContext.shadowBlur = 0; 
                pop();
            }

            dibujarDalia(w, h) {
                beginShape();
                vertex(0, h * 0.5); 
                bezierVertex(w * 0.7, h * 0.1,  w * 0.5, -h * 0.5,  0, -h * 0.5); 
                bezierVertex(-w * 0.5, -h * 0.5, -w * 0.7, h * 0.1,  0, h * 0.5); 
                endShape(CLOSE);
            }
        }

        function windowResized() { resizeCanvas(windowWidth, windowHeight); }
    </script>
</body>
</html>
