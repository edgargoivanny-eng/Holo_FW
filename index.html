<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Holograma Camelia (Preview)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: black; overflow: hidden; font-family: sans-serif; }
        #instrucciones {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            padding: 15px; background: rgba(50, 50, 50, 0.7); color: white;
            border-radius: 10px; pointer-events: none;
            animation: desvanecer 4s forwards; 
        }
        @keyframes desvanecer { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="instrucciones">
        <b>Paso 1:</b> HAZ CLIC en el fondo negro.<br>
        <b>Paso 2:</b> Presiona ESPACIO para generar pétalos.
    </div>

    <script>
        let petalos = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            petalos.push(new Petalo()); // Primer pétalo automático
        }

        function draw() {
            background(0); 

            for (let p of petalos) {
                p.caer();
                p.mostrar();
            }

            // Base verde simple (simula el césped sin cargar imágenes)
            fill(34, 139, 34);
            noStroke();
            rect(0, height - 100, width, 100);
        }

        function keyPressed() {
            if (key === ' ' || keyCode === 32) petalos.push(new Petalo());
        }

        function mousePressed() {
            petalos.push(new Petalo());
        }

        class Petalo {
            constructor() { this.resetear(); }

            resetear() {
                // Posición de inicio (más a la izquierda para tener recorrido de viento)
                this.x = random(-width * 0.1, width * 0.5);
                this.y = random(-200, -50); 
                
                // Forma geométrica (Camelia triangular)
                this.tamBase = random(40, 70); 
                this.proporcion = random(1.1, 1.4); // Más altos que anchos para el triángulo
                
                // FÍSICA CORREGIDA
                this.velY = random(1.0, 2.2);
                
                // Viento siempre activo (mínimo 1.5 hacia la derecha)
                this.vientoBase = random(1.5, 3.0); 
                this.velVaiven = random(0.01, 0.02); // Oscilación lenta
                this.amplitudVaiven = random(1, 2.5); 
                this.faseInicial = random(TWO_PI); 
                
                // Giro 3D drásticamente más lento
                let sentido = random() > 0.5 ? 1 : -1;
                this.velGiro3D = random(0.002, 0.006) * sentido; 

                // ILUMINACIÓN CORREGIDA
                this.factorNitidez = random(0.0, 1.0); 
                this.alphaBase = map(this.factorNitidez, 0, 1, 100, 255);
                
                // Glow más concentrado para que se vea
                this.glowSize = map(this.factorNitidez, 0, 1, 40, 10); 

                // Color del cuerpo blanco, Glow blanco puro al máximo de opacidad (255)
                this.colorCuerpo = color(250, 250, 255, this.alphaBase);
                this.colorResplandor = color(255, 255, 255, 255); 
            }

            caer() {
                this.y += this.velY;
                
                // Viento empuja fuerte + un suave cabeceo orgánico
                let balanceo = sin(frameCount * this.velVaiven + this.faseInicial);
                this.x += this.vientoBase + (balanceo * this.amplitudVaiven);
                
                // Inclinación hacia la derecha por la fuerza del viento
                this.anguloVisual = (this.vientoBase * 0.1) + (balanceo * 0.3);

                if (this.y > height + 100 || this.x > width + 150) {
                    this.resetear();
                }
            }

            mostrar() {
                push();
                translate(this.x, this.y);
                rotate(this.anguloVisual);
                
                // Simulación de vuelta 3D extra lenta
                scale(cos(frameCount * this.velGiro3D + this.faseInicial), 1);
                
                noStroke();

                // Activar el resplandor con fuerza
                drawingContext.shadowBlur = this.glowSize;
                drawingContext.shadowColor = this.colorResplandor;
                fill(this.colorCuerpo);

                // Dibujar forma de camelia triangular
                this.dibujarCameliaTriangular(this.tamBase, this.tamBase * this.proporcion);
                
                // Apagar resplandor
                drawingContext.shadowBlur = 0;
                pop();
            }

            dibujarCameliaTriangular(w, h) {
                beginShape();
                // Punta inferior (donde se uniría a la flor)
                vertex(0, h * 0.5); 
                
                // Lado izquierdo: Sube curvo hacia la esquina superior izquierda
                bezierVertex(-w * 0.6, h * 0.1, -w * 0.5, -h * 0.5, 0, -h * 0.4); 
                
                // Lado derecho: Baja desde la esquina superior derecha hasta la punta inferior
                bezierVertex(w * 0.5, -h * 0.5, w * 0.6, h * 0.1, 0, h * 0.5);
                endShape(CLOSE);
            }
        }

        function windowResized() { resizeCanvas(windowWidth, windowHeight); }
    </script>
</body>
</html>
