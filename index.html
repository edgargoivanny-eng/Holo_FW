<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Holograma Camelia Bioluminiscente</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: black; overflow: hidden; font-family: sans-serif; }
        #instrucciones {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            padding: 15px; background: rgba(50, 50, 50, 0.7); color: white;
            border-radius: 10px; pointer-events: none;
            animation: desvanecer 4s forwards; 
        }
        @keyframes desvanecer { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="instrucciones">
        <b>Prueba Visual:</b> Presiona Espacio o haz clic para generar pétalos celestes.
    </div>

    <script>
        let petalos = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            petalos.push(new Petalo()); // Lanza el primero automáticamente
        }

        function draw() {
            background(0); 

            for (let p of petalos) {
                p.caer();
                p.mostrar();
            }

            // Base oscura para disimular el corte inferior
            fill(10, 30, 10);
            noStroke();
            rect(0, height - 80, width, 80);
        }

        function keyPressed() {
            if (key === ' ' || keyCode === 32) petalos.push(new Petalo());
        }

        function mousePressed() {
            petalos.push(new Petalo());
        }

        class Petalo {
            constructor() { this.resetear(); }

            resetear() {
                this.x = random(-width * 0.1, width * 0.5);
                this.y = random(-200, -50); 
                
                // 1. FORMA MENOS ALARGADA (Más anchos y compactos)
                this.tamBase = random(40, 70); 
                this.proporcion = random(0.8, 1.05); // Ratio cercano a 1:1 para que no sean largos
                
                // FÍSICA Y VIENTO
                this.velY = random(1.0, 2.2);
                this.vientoBase = random(1.5, 3.0); 
                this.velVaiven = random(0.01, 0.02); 
                this.amplitudVaiven = random(1, 2.5); 
                this.faseInicial = random(TWO_PI); 
                
                this.velGiro3D = random(0.002, 0.006) * (random() > 0.5 ? 1 : -1); 

                // ILUMINACIÓN Y ENFOQUE
                this.factorNitidez = random(0.0, 1.0); 
                this.alphaCuerpo = map(this.factorNitidez, 0, 1, 100, 255);
                
                // 3. SUPER RESPLANDOR (Rango mucho más grande)
                this.glowSize = map(this.factorNitidez, 0, 1, 100, 30); 
                this.colorCuerpo = color(255, 255, 255, this.alphaCuerpo); // Centro blanco
            }

            caer() {
                this.y += this.velY;
                let balanceo = sin(frameCount * this.velVaiven + this.faseInicial);
                this.x += this.vientoBase + (balanceo * this.amplitudVaiven);
                this.anguloVisual = (this.vientoBase * 0.1) + (balanceo * 0.3);

                if (this.y > height + 100 || this.x > width + 150) {
                    this.resetear();
                }
            }

            mostrar() {
                push();
                translate(this.x, this.y);
                rotate(this.anguloVisual);
                scale(cos(frameCount * this.velGiro3D + this.faseInicial), 1);
                
                // Aplicar el Resplandor Blanco Intenso
                drawingContext.shadowBlur = this.glowSize;
                drawingContext.shadowColor = 'rgba(255, 255, 255, 1)'; // Blanco puro opacidad 100%

                // 2. BORDE AZUL CELESTE CON POCA DUREZA
                // Un azul cielo semitransparente que se mezclará con el blur
                stroke(135, 206, 235, 180); 
                strokeWeight(4); // Grosor para que el borde se note bien
                
                fill(this.colorCuerpo);

                // Dibujar forma de camelia más ancha
                this.dibujarCameliaAncha(this.tamBase, this.tamBase * this.proporcion);
                
                // Resetear sombras
                drawingContext.shadowBlur = 0;
                pop();
            }

            dibujarCameliaAncha(w, h) {
                beginShape();
                // Punta inferior
                vertex(0, h * 0.5); 
                
                // Lado izquierdo (curva más abierta para hacerlo menos alargado)
                bezierVertex(-w * 0.8, h * 0.1, -w * 0.6, -h * 0.5, 0, -h * 0.3); 
                
                // Lado derecho
                bezierVertex(w * 0.6, -h * 0.5, w * 0.8, h * 0.1, 0, h * 0.5);
                endShape(CLOSE);
            }
        }

        function windowResized() { resizeCanvas(windowWidth, windowHeight); }
    </script>
</body>
</html>
