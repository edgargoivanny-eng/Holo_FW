<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Holograma Dalia Bioluminiscente</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: black; overflow: hidden; font-family: sans-serif; }
        #instrucciones {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            padding: 15px; background: rgba(50, 50, 50, 0.7); color: white;
            border-radius: 10px; pointer-events: none;
            animation: desvanecer 4s forwards; 
        }
        @keyframes desvanecer { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="instrucciones">
        <b>Prueba Visual:</b> Presiona Espacio para ver las Dalias rotando con aura difusa.
    </div>

    <script>
        let petalos = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            petalos.push(new Petalo()); 
        }

        function draw() {
            background(0); 

            for (let p of petalos) {
                p.caer();
                p.mostrar();
            }

            // Base oscura para marcar el suelo del buzón
            fill(5, 15, 5);
            noStroke();
            rect(0, height - 80, width, 80);
        }

        function keyPressed() {
            if (key === ' ' || keyCode === 32) petalos.push(new Petalo());
        }

        function mousePressed() {
            petalos.push(new Petalo());
        }

        class Petalo {
            constructor() { this.resetear(); }

            resetear() {
                this.x = random(-width * 0.1, width * 0.5);
                this.y = random(-200, -50); 
                
                // FORMA DE DALIA (Óvalo elegante de lágrima)
                this.tamBase = random(30, 55); 
                this.proporcion = random(1.3, 1.7); // Más altos que anchos
                
                // FÍSICA
                this.velY = random(0.8, 1.8); // Caída un poco más ligera
                this.vientoBase = random(1.5, 3.0); 
                this.velVaiven = random(0.01, 0.02); 
                this.amplitudVaiven = random(1, 2.5); 
                this.faseInicial = random(TWO_PI); 
                
                // ROTACIÓN PLANA ALEATORIA (Para que caigan de lado, de cabeza, etc.)
                this.anguloRotacion = random(TWO_PI); // Inicia en cualquier ángulo
                this.velRotacionPlana = random(-0.015, 0.015); // Gira lentamente mientras cae
                
                // Giro 3D simulado
                this.velGiro3D = random(0.002, 0.005) * (random() > 0.5 ? 1 : -1); 

                // LUZ Y DESENFOQUE EXTREMO
                this.factorNitidez = random(0.0, 1.0); 
                this.alphaCuerpo = map(this.factorNitidez, 0, 1, 150, 255);
                
                // Tamaños de resplandor mucho más amplios
                this.glowAzul = map(this.factorNitidez, 0, 1, 100, 40); 
                this.glowBlanco = map(this.factorNitidez, 0, 1, 50, 15); 
            }

            caer() {
                this.y += this.velY;
                let balanceo = sin(frameCount * this.velVaiven + this.faseInicial);
                this.x += this.vientoBase + (balanceo * this.amplitudVaiven);
                
                // Aumentamos la rotación base lentamente
                this.anguloRotacion += this.velRotacionPlana;

                // El viento afecta ligeramente la inclinación
                this.inclinacionViento = (this.vientoBase * 0.1) + (balanceo * 0.2);

                if (this.y > height + 100 || this.x > width + 150) {
                    this.resetear();
                }
            }

            mostrar() {
                push();
                translate(this.x, this.y);
                
                // Combinamos el ángulo de caída aleatoria con el empuje del viento
                rotate(this.anguloRotacion + this.inclinacionViento);
                
                scale(cos(frameCount * this.velGiro3D + this.faseInicial), 1);
                
                noStroke(); // NI UN SOLO BORDE DURO

                // ==========================================
                // CAPA 1: EL AURA AZUL DIFUSA (Fondo)
                // ==========================================
                drawingContext.shadowBlur = this.glowAzul;
                drawingContext.shadowColor = 'rgba(135, 206, 235, 1)'; // Resplandor Celeste intenso
                
                // Dibujamos la Dalia un poco más grande y semi-transparente para hacer el "borde suave"
                fill(135, 206, 235, 70); 
                this.dibujarDalia(this.tamBase * 1.25, this.tamBase * this.proporcion * 1.25);

                // ==========================================
                // CAPA 2: EL NÚCLEO BLANCO BRILLANTE (Frente)
                // ==========================================
                drawingContext.shadowBlur = this.glowBlanco;
                drawingContext.shadowColor = 'rgba(255, 255, 255, 1)'; // Resplandor Blanco
                
                // Dibujamos la Dalia en su tamaño real y blanca
                fill(255, 255, 255, this.alphaCuerpo);
                this.dibujarDalia(this.tamBase, this.tamBase * this.proporcion);
                
                drawingContext.shadowBlur = 0; // Resetear sombras
                pop();
            }

            // Matemática rediseñada para una Dalia perfecta
            dibujarDalia(w, h) {
                beginShape();
                vertex(0, h * 0.5); // Punta inferior (Tallo)
                
                // Curva derecha: Sube abriéndose hacia el centro, redondeando la punta superior
                bezierVertex(w * 0.7, h * 0.1,  w * 0.5, -h * 0.5,  0, -h * 0.5); 
                
                // Curva izquierda: Espejo perfecto de la derecha
                bezierVertex(-w * 0.5, -h * 0.5, -w * 0.7, h * 0.1,  0, h * 0.5); 
                endShape(CLOSE);
            }
        }

        function windowResized() { resizeCanvas(windowWidth, windowHeight); }
    </script>
</body>
</html>
